name: Build Themis Android AAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ✅ Java 17 đúng theo Dockerfile
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Go 1.19 đúng theo Dockerfile
      - name: Set up Go 1.19
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      # ✅ Copy NGUYÊN XI từ Dockerfile — dùng full path sdkmanager
      - name: Setup Android SDK
        run: |
          wget -q -O ~/cmdline-tools-linux.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          mkdir -p ~/android-sdk
          cd ~/android-sdk
          unzip -q ~/cmdline-tools-linux.zip
          mv cmdline-tools latest
          mkdir cmdline-tools
          mv latest cmdline-tools
          rm ~/cmdline-tools-linux.zip
          yes | ~/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          ~/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            'build-tools;34.0.0' \
            'cmake;3.22.1' \
            'platforms;android-33' \
            'ndk;25.0.8775105'
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

      # ✅ Fix conflict: trỏ ANDROID_SDK_ROOT = ANDROID_HOME = cùng 1 path
      - name: Build JavaThemis AAR
        run: ./gradlew :android:assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      # Tự tìm AAR — không hardcode path
      - name: Find and zip AAR
        run: |
          AAR=$(find . -name "*.aar" \
            -not -path "*/.gradle/*" \
            -not -path "*/cache/*" \
            | head -1)
          echo "✅ Found AAR: $AAR"
          zip themis-android.zip "$AAR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: themis-android-aar
          path: themis-android.zip
          retention-days: 30
